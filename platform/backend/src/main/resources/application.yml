server:
  port: 8088
  compression:
    enabled: true

spring:
  application:
    name: carbonbal
  profiles:
    # 默认 dev（H2）；生产用 SPRING_PROFILES_ACTIVE=prod 覆盖。
    # 用 default 而不是 active，避免 yml 里的 active 覆盖运维显式指定的 profile。
    default: dev
  jackson:
    default-property-inclusion: non_null
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

app:
  file:
    root: ./data/files
  report:
    # 报告页脚 [MACHINE] 机器可读摘要：生产默认关闭，自动化/测试环境置 true
    machine-line: ${REPORT_MACHINE_LINE:false}
  jwt:
    # 生产必须通过 JWT_SECRET 注入（bash deploy/gen-secret.sh 可生成）。
    # 留空时：dev 由 dev-auto-secret 生成一次性随机密钥；非 dev 直接启动失败。
    secret: ${JWT_SECRET:}
    ttl-hours: ${JWT_TTL_HOURS:8}
    # 仅 dev profile 置 true：无密钥时生成临时密钥并 WARN（不打印密钥值）
    dev-auto-secret: ${JWT_DEV_AUTO_SECRET:false}
  org-id: 1
  cors:
    # 生产填具体域名（逗号分隔），如 https://carbon.example.com；留空表示不开放跨域
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  jobs:
    enabled: false
  auth:
    cookie:
      enabled: ${AUTH_COOKIE:true}
      # HTTPS 部署置 true；本机 HTTP 调试保持 false，否则浏览器不保存 Cookie
      secure: ${AUTH_COOKIE_SECURE:false}
    captcha:
      enabled: ${AUTH_CAPTCHA:true}
      # 密码登录是否强制图形验证码；联调/压测可用 AUTH_CAPTCHA_LOGIN=false 关闭
      login-enabled: ${AUTH_CAPTCHA_LOGIN:true}
    password:
      min-length: ${AUTH_PWD_MIN:12}
      expire-days: ${AUTH_PWD_EXPIRE_DAYS:90}
      history: ${AUTH_PWD_HISTORY:3}
    # 「账号 + IP」维度：连续失败 5 次锁定（挡撞库）
    max-attempts: 5
    # 「账号」维度：阈值更高，挡轮换 X-Forwarded-For 绕过 IP 锁定的爆破
    max-attempts-account: ${AUTH_MAX_ATTEMPTS_ACCOUNT:20}
    lock-minutes: 15
    # 只有 remoteAddr 命中该白名单（逗号分隔）才信任 X-Forwarded-For；留空=不信任任何代理
    trusted-proxies: ${TRUSTED_PROXIES:}
  # 幂等请求边界（P1-4）：阈值配置化，避免"256KB 以上静默放行"和"无上限 readAllBytes"
  idempotency:
    # ≤ 该值的请求体驻留内存；超过则边读边 digest 边落临时文件（请求结束即删除）
    max-inline-bytes: ${IDEM_MAX_INLINE:1048576}
    # 硬上限：超过直接 413，不读进内存
    max-body-bytes: ${IDEM_MAX_BODY:10485760}
    # 可回写缓存的响应体上限：超过则不缓存响应体（占位行删除，允许重试）
    max-response-bytes: ${IDEM_MAX_RESPONSE:1048576}
    ttl-hours: ${IDEM_TTL_HOURS:24}
  sms:
    # 生产留空：随机 6 位，只出现在短信里。演示可设 123456 并用短信日志查看
    fixed-code: ${SMS_FIXED_CODE:}
    # 演示环境可把验证码回显到接口响应；生产必须 false
    expose-code: ${SMS_EXPOSE_CODE:false}
  seed:
    enabled: ${SEED_ENABLED:true}

logging:
  level:
    root: INFO
    com.carbonbal: INFO

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:carbonbal;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  report:
    machine-line: true
  jwt:
    # dev 兜底：无 JWT_SECRET 时生成一次性随机密钥（重启即失效），避免仓库里出现可用的默认密钥
    dev-auto-secret: ${JWT_DEV_AUTO_SECRET:true}
  sms:
    fixed-code: ${SMS_FIXED_CODE:123456}
    expose-code: ${SMS_EXPOSE_CODE:true}

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/carbonbal?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER:carbonbal}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
      connection-timeout: 5000

app:
  jobs:
    enabled: ${JOBS_ENABLED:true}

logging:
  file:
    name: ${LOG_FILE:./logs/carbonbal.log}
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 14
