# 测试固定配置（P0-2）：让 mvn test 与环境变量解耦
# - 不依赖 JWT_SECRET：避免开发者 shell 里残留的默认密钥导致上下文起不来
# - 不使用 dev-auto-secret：避免每个 Spring 上下文生成不同随机密钥，便于跨类排查
# 注意：这是测试专用强密钥（≥32 位、去重字符 ≥12、不在黑名单前缀内），只允许出现在测试资源里。
app.jwt.secret=unit-test-fixed-secret-9f3a7c1e5b8d2a4f6c0e3b7d9a1f5c8e
app.jwt.dev-auto-secret=false

# 测试清理会删除 org_id<>1 的全部数据：默认只允许 H2（P0-1）
app.test.allow-non-h2=false

# 登录锁定：与生产默认值保持一致，便于用例推导阈值
app.auth.max-attempts=5
app.auth.max-attempts-account=20
# 默认不信任任何反向代理 = 忽略 X-Forwarded-For（P1-3）
app.auth.trusted-proxies=
