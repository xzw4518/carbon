name: ci

# 推送即用（P1-9）：ubuntu runner 自带 JDK/Node，前端无障碍服务时只跑离线段。
# 需要活服务的段（smoke/e2e/ui-flows/check-ui）在 CI 里默认不跑：
#   · 它们依赖演示库种子数据与真实浏览器，在共享 runner 上易成新的红灯源；
#   · 需要时用 workflow_dispatch 手动触发并显式 --with-service（runner 需能够起 Spring Boot）。
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      with_service:
        description: '是否追加活服务段（smoke/e2e/ui-flows/check-ui）'
        required: false
        default: 'false'

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 仓库不提交 platform/env.sh（含本机路径）；CI 里直接用 runner 的 JDK/Maven
      - name: Backend unit tests
        working-directory: platform/backend
        run: mvn -B test

      - name: Coverage report (JaCoCo)
        if: always()
        working-directory: platform/backend
        run: mvn -B -Pcoverage test

      - name: Frontend static gate (L0)
        working-directory: carbonbal-web
        run: node tools/gate-l0.cjs

      - name: Frontend XSS assertions
        working-directory: carbonbal-web
        run: node tools/xss-check.cjs

      - name: Docs/facts consistency
        run: bash platform/backend/tools/check-docs.sh

      - name: Frontend build artifact in sync
        run: bash platform/tools/sync-frontend.sh --check

      - name: Delivery package self-check
        run: bash platform/tools/package-source.sh --check

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: platform/backend/target/surefire-reports/**
          if-no-files-found: warn

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: platform/backend/target/site/jacoco/**
          if-no-files-found: warn
